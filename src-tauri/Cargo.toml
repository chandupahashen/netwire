[package]
name = "netwire"
version = "0.1.0"
description = "NetWire - GlassWire-like advanced network monitor (Tauri v2)"
authors = ["NetWire"]
license = "MIT"
edition = "2021"

[lib]
name = "netwire_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-notification = "2"
tauri-plugin-autostart = "2"
tauri-plugin-dialog = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = "0.26"
futures-util = "0.3"
sysinfo = "0.36"
netstat2 = "0.11"
rusqlite = { version = "0.32", features = ["bundled"] }
chrono = "0.4"
dns-lookup = "2"
maxminddb = "0.24"
once_cell = "1.19"
parking_lot = "0.12"
anyhow = "1"
sha2 = "0.10"
hex = "0.4"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls-webpki-roots"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Win32_NetworkManagement_IpHelper", "Win32_Networking_WinSock", "Win32_Foundation"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
