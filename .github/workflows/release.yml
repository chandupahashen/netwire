name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  publish:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/setup@v3
        with:
          runtime: node@22
          require-lockfile: true
          cache: true

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting and backend
        run: |
          cargo fmt --manifest-path src-tauri/Cargo.toml --all -- --check
          cargo check --locked --manifest-path src-tauri/Cargo.toml

      - name: Check tag matches package version
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}".TrimStart("v")
          $pkg = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $conf = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          $cargo = Select-String -Path src-tauri/Cargo.toml -Pattern '^version = "(.*)"' | Select-Object -First 1 | ForEach-Object { $_.Matches.Groups[1].Value }
          if ($tag -ne $pkg -or $tag -ne $conf -or $tag -ne $cargo) {
            Write-Error "Tag v$tag does not match package versions (package.json=$pkg, tauri.conf.json=$conf, Cargo.toml=$cargo). Bump all three first."
            exit 1
          }

      - name: Configure GitHub Releases updater endpoint
        shell: pwsh
        run: |
          $endpoint = "https://github.com/${{ github.repository }}/releases/latest/download/latest.json"
          $config = @{ plugins = @{ updater = @{ endpoints = @($endpoint) } } } | ConvertTo-Json -Depth 5
          Set-Content -Path updater-release.json -Value $config -Encoding utf8

      - name: Build and publish release
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: NetWire ${{ github.ref_name }}
          releaseBody: Download the Windows installer below. NetWire checks GitHub Releases for updates.
          releaseDraft: false
          prerelease: false
          uploadUpdaterJson: true
          updaterJsonPreferNsis: true
          args: --config updater-release.json
